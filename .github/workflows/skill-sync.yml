name: Skill Sync Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-skill-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated skill is in sync
        run: npm run check-skill-sync
